name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run live tests (@pytest.mark.live)"
        required: false
        type: boolean
        default: true
      pytest_args:
        description: "Additional pytest arguments"
        required: false
        default: ""
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint and format check
      run: |
        ruff check .
        ruff format --check .

    - name: Type check
      run: |
        mypy src

    - name: Run offline tests
      run: |
        pytest -v -m "not live"

  live:
    name: Run live tests
    if: github.event_name == 'workflow_dispatch' && (inputs.run_live || inputs.run_live == null)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run live tests
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      run: |
        pytest -v -m live ${{ inputs.pytest_args }}
