[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calbi"
version = "0.1.0"
description = "Autonomous Playbook Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ayan Shah" }
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = [
    "httpx>=0.27.0",
]
memory = []
postgres = [
    "psycopg[binary,pool]>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "calbi[ai,memory,postgres]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/calbi"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: marks tests as requiring real external services/keys",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
